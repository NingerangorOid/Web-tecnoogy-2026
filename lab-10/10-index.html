<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Крестики-нолики — лабораторная 10</title>
  <link rel="stylesheet" href="10-style.css">
  <script src="10-TicTacToe.js" defer></script>
  <script src="10-main.js" defer></script>
</head>
<body><main class="app"><h1>Крестики-нолики</h1><p>Игра для двух игроков. Первый ход — X.</p><div class="row-controls"><button id="restart-btn">Рестарт</button><span>Сейчас ходит: <strong id="move-value" aria-live="polite"></strong></span></div><div class="tic-tac-toe" id="tic-tac-toe"><button class="tic-tac-toe__ceil" type="button" data-row="1" data-col="1" aria-label="Строка 1, столбец 1"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="1" data-col="2" aria-label="Строка 1, столбец 2"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="1" data-col="3" aria-label="Строка 1, столбец 3"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="2" data-col="1" aria-label="Строка 2, столбец 1"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="2" data-col="2" aria-label="Строка 2, столбец 2"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="2" data-col="3" aria-label="Строка 2, столбец 3"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="3" data-col="1" aria-label="Строка 3, столбец 1"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="3" data-col="2" aria-label="Строка 3, столбец 2"></button>
<button class="tic-tac-toe__ceil" type="button" data-row="3" data-col="3" aria-label="Строка 3, столбец 3"></button></div></main></body>
</html>
